name: Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: wib-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) { if (item.severity === 'high' || item.severity === 'critical') console.log(name + ': ' + item.severity + ' - ' + (item.fixAvailable ? 'fix available' : 'no automatic fix')); }"
      - name: Build Next.js
        run: npm run build
