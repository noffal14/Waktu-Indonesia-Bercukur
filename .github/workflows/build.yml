name: Build

on:
  push:
    branches:
      - main
      - feat/firebase-backend-foundation
  pull_request:
    branches:
      - main

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Next.js
        run: npm run build
